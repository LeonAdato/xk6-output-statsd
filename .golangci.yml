# v2.12.2
# Please don't remove the first line. It uses in CI to determine the golangci version
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gocognit
    - goconst
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - revive
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - typecheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    nolintlint:
      allow-unused: false
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable:
        - shadow
    cyclop:
      max-complexity: 25
    dupl:
      threshold: 150
    goconst:
      min-len: 10
      min-occurrences: 4
    funlen:
      lines: 80
      statements: 60
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
        - pattern: '^os\.(.*)$'
          msg: "Using anything except Signal and SyscallError from the os package is forbidden"
        - pattern: '^syscall\.[^A-Z_]+$'
          msg: "Using anything except constants from the syscall package is forbidden"
        - pattern: '^logrus\.Logger$'
  exclusions:
    # We want to try and improve the linting in the codebase, so individual
    # non-golint items from the default exclusion list will gradually be added
    # to the rules below
    rules:
      - path: _(test|gen)\.go
        linters:
          - cyclop
          - dupl
          - gocognit
          - funlen
          - lll
      - linters:
          - staticcheck
        text: "The entire proto file grpc/reflection/v1alpha/reflection.proto is marked as deprecated."
      - linters:
          - forbidigo
        text: 'use of `os\.(SyscallError|Signal|Interrupt)` forbidden'

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
